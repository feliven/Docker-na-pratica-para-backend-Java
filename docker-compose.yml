services:
  db:
    image: postgres
    container_name: my-postgres
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=alura_series
    ports:
      - 5432:5432
  localstack:
    image: localstack/localstack
    container_name: my-localstack
    ports:
      - 127.0.0.1:4566:4566 # LocalStack Gateway
      - 127.0.0.1:4510-4559:4510-4559 # external services port range
      - 127.0.0.1:443:443 # LocalStack HTTPS Gateway
    environment:
      # Activate LocalStack for AWS: https://docs.localstack.cloud/getting-started/auth-token/
      - LOCALSTACK_AUTH_TOKEN=ls-qILiHaFO-DORI-8751-5708-MUHomaFA1e24
      # LocalStack configuration: https://docs.localstack.cloud/references/configuration/
      - DEBUG=${DEBUG:-0}
      - PERSISTENCE=${PERSISTENCE:-0}
  rabbitmq:
    image: rabbitmq
    container_name: my-rabbitmq
    ports:
      - 5672:5672
      - 15672:15672
    environment:
      RABBITMQ_DEFAULT_USER: coelho-lapin
      RABBITMQ_DEFAULT_PASS: coelho-lapin
    configs:
      - source: rabbitmq-plugins
        target: /etc/rabbitmq/enabled_plugins
  redis:
    image: redis
    container_name: my-redis
    ports:
      - 6379:6379
    environment:
      - REDIS_ARGS=--requirepass senha-redis --appendonly yes
  zipkin:
    image: ghcr.io/openzipkin/zipkin-slim
    container_name: zipkin
    environment:
      - STORAGE_TYPE=mem
    ports:
      # Port used for the Zipkin UI and HTTP Api
      - 9411:9411

configs:
  rabbitmq-plugins:
    content: "[rabbitmq_management]."
